<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="page-game">
  <header class="container">
    <div class="logo"><span>HandBridge</span></div>
    <nav><ul><li><a href="index.html">&larr; Back to Home</a></li></ul></nav>
    <div class="game-timer" id="game-timer">Time: <span>10</span>s</div>
  </header>

  <main class="container">
    <div class="game-challenge-area">
      <div class="game-challenge">
        <h3>Make the sign for:</h3>
        <div class="game-letter" id="game-letter">A</div>
      </div>

      <div class="video-column">
        <h3>Your Webcam</h3>
        <div class="video-box" id="webcam-container">
          <video id="webcam-feed" autoplay playsinline></video>
          <canvas id="overlay" width="640" height="480"></canvas>
          <div class="loading-shimmer" id="webcam-loading">Starting camera...</div>
        </div>
      </div>
    </div>

    <div class="feedback-area" id="feedback-box"><p>Get ready...</p></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="script.js"></script>
</body>
</html>
